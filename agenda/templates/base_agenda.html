<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgendaPsi{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f6f8; color: #222; font-family: Arial, sans-serif; }
        main { max-width: 900px; margin: 32px auto; padding: 24px; background: white; border-radius: 12px; }
        nav { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 24px; }
        a { color: #4338ca; }
        h1 { font-size: 26px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #bbb; border-radius: 8px; }
        button { padding: 12px 20px; background: #4f46e5; color: white; border: 0; border-radius: 8px; cursor: pointer; }
        .errorlist { color: #a11; }
        .message { padding: 12px; background: #e8f5e9; border-radius: 8px; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        .ocupado { color: #a11; font-weight: bold; }
        .disponivel { color: #176b36; }
        @media (max-width: 600px) { main { margin: 12px; padding: 16px; } }
    </style>
</head>
<body>
<main>
    <nav><a href="{% url 'index' %}">Profissionais</a><a href="{% url 'cadastroProfissional' %}">Cadastrar profissional</a></nav>
    {% for message in messages %}<p class="message" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
